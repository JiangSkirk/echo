services:
  js-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: js-agent
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
      - ./state:/app/state
    environment:
      - JS_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  js-agent-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: js-agent-dev
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/app/workspace
      - ./state:/app/state
      - .:/app
    environment:
      - JS_LOG_LEVEL=DEBUG
    command: ["js", "web", "--host", "0.0.0.0", "--port", "8080", "--reload"]
