id: large_file_truncation
name: Handle large file read
description: Agent should read a large file and handle truncation gracefully.
input: Read bigdata.txt and show me the first 100 characters
tags:
- file
- large
- performance
max_turns: 3
setup:
  files:
  - path: bigdata.txt
    content: START__END
scoring:
  expected_output_contains:
  - START_
  expected_tool_calls:
  - file_read
