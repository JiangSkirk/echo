[project]
name = "js-agent"
version = "0.1.5"
description = "Local personal Agent Harness — local release candidate for controlled trial"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "JS Team"}
]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "rich>=13.9,<16",
    "textual>=0.70,<9",
    "aiosqlite>=0.20,<1",
    "cachetools>=5.5,<8",
    "click>=8.1,<9",
    "httpx[http2]>=0.27,<1",
    "openai>=1.55,<3",
    "prompt-toolkit>=3.0,<4",
    "structlog>=24.4,<26",
    "platformdirs>=4.3,<5",
    "python-dotenv>=1.0,<2",
    "cryptography>=49.0.0,<51",
    "packaging>=24.2,<27",
    "psutil>=6.1,<8",
    "watchdog>=6.0,<7",
    "anyio>=4.7,<5",
    "tenacity>=9.0,<10",
    "pyyaml>=6.0,<7",
    "fastapi>=0.139,<1",
    "starlette>=1.3.1,<2",
    "python-multipart>=0.0.32,<1",
    "uvicorn>=0.32,<1",
    "openpyxl>=3.1,<4",
    "rfc8785==0.1.4",
    "xlrd==2.0.2",
    "pypdf>=6.15.0,<7",
    "python-docx>=1.2,<2",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
desktop = [
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
]
telegram = [
    "python-telegram-bot>=21.0,<23",
]
discord = [
    "discord.py>=2.4,<3",
]
monitor = [
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation>=0.50",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-httpx>=0.50",
]
office = [
    "pandas>=2.2",
]
echo-tokenizer = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hatchling>=1.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "build>=1.2",
    "pip-audit>=2.7",
    "opentelemetry-distro>=0.50",
    "types-PyYAML>=6.0",
    "types-psutil>=6.1",
    "types-reportlab>=4.0",
    "websockets>=12",
    "playwright>=1.52,<2",
    "httpx2>=2.4",  # Starlette TestClient prefers httpx2 over plain httpx
    "hypothesis>=6.112",
    "mutmut>=3.3,<4",
    "js-agent[office,pdf]",
]

[tool.mutmut]
source_paths = ["js"]
only_mutate = [
    "js/security/parser.py",
    "js/security/guard.py",
    "js/security/rules.py",
    "js/security/net_guard.py",
    "js/echo/ledger/strict_json.py",
    "js/echo/ledger/journal.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_security.py",
    "tests/test_security_rules.py",
    "tests/test_security_shell_allowlist.py",
    "tests/test_security_hardening_round3.py",
    "tests/test_net_guard.py",
    "tests/echo/ledger/test_file_journal_recovery.py",
    "tests/echo/ledger/test_journal_effects.py",
    "tests/echo/ledger/test_core_contract.py",
    "tests/property/test_parser_ast.py",
    "tests/property/test_ledger_json.py",
    "tests/security/test_mutation_kills.py",
    "tests/test_security_expanded.py",
]
pytest_add_cli_args = ["-q", "--tb=no"]
do_not_mutate = ["**/__init__.py"]
also_copy = ["js_work/", "resources/"]

[project.scripts]
js = "js.__main__:main"
js-work = "js_work.cli:compat_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["js", "js_work"]
force-include = { "js/security/secrets.py" = "js/security/secrets.py", "resources/tokenizer" = "resources/tokenizer" }

[tool.hatch.build.targets.sdist]
include = [
    "/js/**",
    "/js_work/**",
    "/LICENSE",
    "/ORIGIN_LEDGER.md",
    "/README.md",
    "/README_en.md",
    "/SECURITY.md",
    "/SECURITY_en.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
    "/resources/**",
    "/uv.lock",
    "/constraints.txt",
]
force-include = { "js/security/secrets.py" = "js/security/secrets.py", "README_en.md" = "README_en.md" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "TC001", "TC003", "SIM105", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_r6_memory_persistent.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
exclude = []

[[tool.mypy.overrides]]
module = [
    "docx.*",
    "pypdf.*",
    "pdfplumber.*",
    "pandas.*",
    "openpyxl.*",
    "rfc8785.*",
    "tiktoken",
    "telegram.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not playwright'"
markers = [
    "playwright: Browser automation tests (run separately)",
    "t8s3a_gate: T8-S3A real-tokenizer threshold gate; requires echo-tokenizer extra",
]
