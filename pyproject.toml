[project]
name = "js-agent"
version = "0.1.0"
description = "A stable, secure, and convenient AI agent framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "JS Team"}
]
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "textual>=0.70",
    "gymnasium>=1.0",
    "click>=8.1",
    "httpx>=0.27",
    "openai>=1.55",
    "prompt-toolkit>=3.0",
    "structlog>=24.4",
    "platformdirs>=4.3",
    "python-dotenv>=1.0",
    "cryptography>=44.0",
    "packaging>=24.2",
    "psutil>=6.1",
    "watchdog>=6.0",
    "anyio>=4.7",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation>=0.50",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-httpx>=0.50",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "opentelemetry-distro>=0.50",
]

[project.scripts]
js = "js.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["js"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "TC001", "TC003", "SIM105", "SIM108", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
