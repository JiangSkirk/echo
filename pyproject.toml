[project]
name = "js-agent"
version = "0.1.5"
description = "Local personal Agent Harness — local release candidate for controlled trial"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "JS Team"}
]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.14.2",
    "rich>=13.9",
    "textual>=0.70",
    "aiosqlite>=0.20",
    "cachetools>=5.5",
    "click>=8.1",
    "httpx[http2]>=0.27",
    "openai>=1.55,<3",
    "prompt-toolkit>=3.0",
    "structlog>=24.4",
    "platformdirs>=4.3",
    "python-dotenv>=1.0",
    "cryptography>=49.0.0,<51",
    "packaging>=24.2",
    "psutil>=6.1",
    "watchdog>=6.0",
    "anyio>=4.7",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "fastapi>=0.139,<1",
    "starlette>=1.3.1,<2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.32",
    "openpyxl>=3.1",
    "rfc8785==0.1.4",
    "xlrd==2.0.2",
    "pypdf>=6.15.0",
    "python-docx>=1.2",
    "reportlab>=4.0",
]

[project.optional-dependencies]
desktop = [
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
]
telegram = [
    "python-telegram-bot>=21.0,<23",
]
monitor = [
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation>=0.50",
    "opentelemetry-instrumentation-fastapi>=0.50",
    "opentelemetry-instrumentation-httpx>=0.50",
]
office = [
    "pandas>=2.2",
]
echo-tokenizer = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hatchling>=1.27",
    "mypy>=1.13",
    "ruff>=0.8",
    "build>=1.2",
    "pip-audit>=2.7",
    "opentelemetry-distro>=0.50",
    "types-PyYAML>=6.0",
    "types-psutil>=6.1",
    "types-reportlab>=4.0",
    "websockets>=12",
    "playwright>=1.52,<2",
    "httpx2>=2.4",  # Starlette TestClient prefers httpx2 over plain httpx
    "js-agent[office,pdf]",
]
[project.scripts]
js = "js.__main__:main"
js-work = "js_work.cli:compat_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["js", "js_work"]
force-include = { "js/security/secrets.py" = "js/security/secrets.py", "resources/tokenizer" = "resources/tokenizer" }

[tool.hatch.build.targets.sdist]
include = [
    "/js/**",
    "/js_work/**",
    "/LICENSE",
    "/ORIGIN_LEDGER.md",
    "/README.md",
    "/README_en.md",
    "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml",
    "/resources/**",
    "/uv.lock",
]
force-include = { "js/security/secrets.py" = "js/security/secrets.py", "README_en.md" = "README_en.md" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501", "TC001", "TC003", "SIM105", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_r6_memory_persistent.py" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
exclude = []

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*", "pdfplumber.*", "pandas.*", "openpyxl.*", "rfc8785.*", "tiktoken", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not playwright'"
markers = [
    "playwright: Browser automation tests (run separately)",
    "t8s3a_gate: T8-S3A real-tokenizer threshold gate; requires echo-tokenizer extra",
]
