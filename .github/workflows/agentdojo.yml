name: AgentDojo report

on:
  schedule:
    - cron: "27 4 * * 1-6"
    - cron: "41 5 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "subset = CI split; full = CI + held-out (held-out is never used to tune)"
        type: choice
        options:
          - subset
          - full
        default: subset

env:
  UV_VERSION: "0.11.24"
  AGENTDOJO_BUDGET_USD: "8"
  AGENTDOJO_MODEL: "gpt-4o-2024-08-06"
  AGENTDOJO_SEEDS: "1,2,3"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Select suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.suite }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 5 * * 0" ]; then
            echo "name=full" >> "$GITHUB_OUTPUT"
          else
            echo "name=subset" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AgentDojo adapter (always report)
        run: |
          uv run python -m benchmarks.agentdojo.run \
            --suite "${{ steps.suite.outputs.name }}" \
            --model "${AGENTDOJO_MODEL}" \
            --seeds "${AGENTDOJO_SEEDS}" \
            --budget-usd "${AGENTDOJO_BUDGET_USD}" \
            --output benchmarks/agentdojo/last_report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentdojo-report
          path: benchmarks/agentdojo/last_report.json
