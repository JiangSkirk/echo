name: Release Smoke

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  UV_VERSION: "0.11.24"

jobs:
  release-smoke:
    name: macOS / Python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install frozen extras
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Build release artifacts
        run: uv run python -m build --outdir dist

      - name: Verify installed wheel in a clean virtual environment
        run: uv run python scripts/verify_installed_artifact.py --artifact-dir dist --audit

      - name: Run release smoke checks
        run: uv run python scripts/release_smoke.py --all

      - name: Install Chromium for browser gate
        if: matrix.python-version == '3.12'
        run: uv run python -m playwright install chromium

      - name: Run self-contained browser gate
        if: matrix.python-version == '3.12'
        run: uv run python -m pytest -q -m playwright tests/e2e

      - name: Run wheel and sdist isolated install checks
        env:
          RELEASE_ARTIFACT_DIR: dist
        run: uv run python -m pytest tests/test_release_package_isolation.py -q

      - name: Verify generated release evidence is current
        run: uv run python scripts/generate_release_evidence.py --check

      - name: Verify benchmark-bound Echo audit reports
        run: uv run python scripts/echo_full_audit.py --rounds 10 --check --fix-verification

  stable-release-gate:
    name: Stable release approval gate
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment: stable-release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install frozen package
        run: |
          uv lock --check
          uv sync --frozen --no-dev

      - name: Require independently trusted external approvals
        env:
          JS_ECHO_TRUSTED_REVIEW_KEYS: ${{ secrets.JS_ECHO_TRUSTED_REVIEW_KEYS }}
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from js.echo.ledger.release_gates import verify_release_readiness

          report = verify_release_readiness(Path("."))
          print(f"internal_ready={report.internal_ready}")
          print(f"stable_ready={report.stable_ready}")
          print("internal_blockers=" + ",".join(report.internal_blockers))
          print("external_blockers=" + ",".join(report.external_blockers))
          if not report.stable_ready:
              raise SystemExit("Stable release blocked: independently trusted external approvals are required.")
          PY
