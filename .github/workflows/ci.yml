name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitor]"

      - name: Lint with Ruff
        run: ruff check js/ js_work/ tests/ scripts/

      - name: Type check with mypy
        run: mypy js/ js_work/ --no-error-summary

      - name: Test with pytest
        run: pytest tests/ -v --tb=short

      - name: Build release artifacts
        run: |
          pip install build
          python -m build --wheel --sdist --outdir dist

      - name: Verify and audit the built wheel in clean virtual environments
        run: python scripts/verify_installed_artifact.py --artifact-dir dist --audit

  browser-e2e:
    name: Browser E2E hard gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run self-contained Playwright gate
        run: python -m pytest -q -m playwright tests/e2e
