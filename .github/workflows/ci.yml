name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  UV_VERSION: "0.11.24"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify lockfile and install frozen extras
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra monitor --extra echo-tokenizer

      - name: Lint with Ruff
        run: uv run ruff check js/ js_work/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy js/ js_work/ --no-error-summary

      - name: Test with pytest
        run: uv run pytest tests/ -v --tb=short

      - name: Build release artifacts
        run: uv run python -m build --wheel --sdist --outdir dist

      - name: Verify and audit the built wheel in clean virtual environments
        run: uv run python scripts/verify_installed_artifact.py --artifact-dir dist --audit

  browser-e2e:
    name: Browser E2E hard gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify lockfile and install frozen extras
        run: |
          uv lock --check
          uv sync --frozen --extra dev

      - name: Install Chromium
        run: uv run python -m playwright install --with-deps chromium

      - name: Run self-contained Playwright gate
        run: uv run python -m pytest -q -m playwright tests/e2e

  density-and-coverage:
    name: Density ratchet and coverage floors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Verify lockfile and install frozen extras
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra monitor --extra echo-tokenizer

      - name: Test density ratchet
        run: uv run python scripts/test_density_report.py --min 1.2

      - name: Coverage floors
        run: |
          uv run pytest tests/ -q --tb=line \
            --cov=js --cov-branch \
            --cov-report=json:coverage.json \
            --cov-report=term:skip-covered
          uv run python scripts/check_coverage_floors.py --json coverage.json
