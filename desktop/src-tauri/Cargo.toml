[package]
name = "js-agent-desktop"
version = "0.1.0"
description = "Least-authority native shell for JS Agent"
authors = ["JS Agent contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "js_agent_desktop"
path = "src/lib.rs"

[[bin]]
name = "js-agent-desktop"
path = "src/main.rs"

[dev-dependencies]
serde_json = "=1.0.151"

[dependencies]
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
signal-hook = "=0.3.18"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
url = "=2.5.8"
zeroize = "=1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSUserDefaults",
    "NSValue",
] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
